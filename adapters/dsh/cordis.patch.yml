# The residue-cleaner adapter for dsh (DeepSeek Harness) profiles.
# Merge into your profile's cordis.patch.yml (concat the `- id:` entries;
# ids are namespaced as residue-cleaner-* to avoid collisions).
# dsh has no documented session-stop hook surface for external commands, so:
#   - the brevity rule rides the proven personaSuffix channel;
#   - end-of-task cleanup is a deterministic shell one-liner the agent runs
#     (engine is stdin/env free and accepts --project explicitly).

- id: residue-cleaner-system-prompt
  config:
    personaSuffix: |-
      Your working directory is {{cwd}}.
      【输出守则】回答直奔结论和新信息:不复述用户已知背景,不写客套话、空洞总结或教学铺垫;能用一句话说清就不用三句;除非用户明确要求,不主动生成报告、总结或逐条复述刚才做过的事。
      【收尾清运】结束一次产生过临时文件的工作后,运行一次:
        python "<本插件安装路径>/hooks/cleanup.py" --project "{{cwd}}"
      只清运、不询问;文件只进回收站,不会真删。
